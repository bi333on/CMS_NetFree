# NetFree — конфигурация nginx.
# Веб-корень: только папка public/.

server {
    listen 80;
    server_name example.com;

    root /var/www/netfree/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Статика темы
    location ~ ^/assets/ {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Закрываем прямые запросы к чувствительным файлам.
    location ~ /\.(env|ini|log|sql|md) {
        deny all;
    }

    location ~ /(composer\.(json|lock)|install\.php) {
        deny all;
    }
}
